{% extends "clinica/base.html" %}

{% block title %}Confirmar Eliminación de Paciente{% endblock %}

{% block content %}
<h1>Confirmar Eliminación de Paciente</h1>
<p>¿Estás seguro de que deseas eliminar al paciente "{{ paciente.nombre }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit"class="button_eliminar">Sí, eliminar</button>
</form>
    <a href="{% url 'paciente_list' %}"class="button_cancelar">Cancelar</a>
{% endblock %}
