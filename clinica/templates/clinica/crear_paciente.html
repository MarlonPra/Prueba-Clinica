{% extends "clinica/base.html" %}

{% block title %}Crear Paciente{% endblock %}

{% block content %}
    <h1>Crear Nuevo Paciente</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button">Crear Paciente</button>
    </form>
    <a href="{% url 'paciente_list' %}" class="button_cancelar" style="margin: 20px;">Volver a la lista de pacientes</a>
{% endblock %}
